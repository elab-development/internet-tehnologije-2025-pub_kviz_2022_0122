version: "3.9"

services:
  app:
    build:
      context: .
      args:
        - JWT_SECRET=${JWT_SECRET}
    container_name: pubkviz_app
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-net
    command: >
      sh -c "npx drizzle-kit push && 
             node dist/seed.cjs || echo 'Seed failed' && 
             node server.js"

  db:
    image: postgres:16-alpine
    container_name: pubkviz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pubquiz
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pubquiz"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db-data: